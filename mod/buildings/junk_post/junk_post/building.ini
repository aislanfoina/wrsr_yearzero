$NAME_STR "Junkyard Trade Post"
; A scrap-yard flavoured trade post: the same construction goods as the Survival
; Trade Post, sold from a junkyard. Worker-free, runs on power.

; A trade post built as an ordinary FACTORY rather than a customs house.
;
; The customs house turned out to be a black box: goods are minted from nothing,
; never appear in any storage, and are billed continuously by a function that
; cannot be safely hooked. Four separate attempts to measure how much was bought
; failed because of it.
;
; A factory has none of that opacity. Goods really sit in its storage, the
; vanilla UI shows them, and the amount goes DOWN when a truck loads - which is
; the signal the customs house never gave us.
;
; So the whole mechanic falls out of vanilla data:
;
;   restock rule   PRODUCTION plus WORKERS_NEEDED - so many workers make so
;                  many tonnes a day, exactly like any other factory
;   stock          the real storage contents, visible in the building window
;   runs out       when the storage is empty there is nothing to load
;
; The only thing a plugin has to add is that the goods must be PAID FOR on the
; way out, instead of being free like a normal factory's output.

-------
$COST_WORK SOVIET_CONSTRUCTION_GROUNDWORKS 0.0
$COST_WORK_BUILDING_ALL
$COST_RESOURCE_AUTO ground_asphalt 	0.05

$TYPE_FACTORY
$PRODUCTION gravel 0.60
$PRODUCTION bricks 0.20
$PRODUCTION boards 0.15
$PRODUCTION steel 0.12
$PRODUCTION cement 0.10
$CONSUMPTION_PER_SECOND eletric 0.02
$WASTE_PRODUCTION_DISABLE
$HEATING_DISABLE
$STORAGE_EXPORT_SPECIAL RESOURCE_TRANSPORT_GRAVEL 120 gravel
$STORAGE_EXPORT_SPECIAL RESOURCE_TRANSPORT_OPEN 60 bricks
$STORAGE_EXPORT_SPECIAL RESOURCE_TRANSPORT_OPEN 60 boards
$STORAGE_EXPORT_SPECIAL RESOURCE_TRANSPORT_OPEN 40 steel
$STORAGE_EXPORT_SPECIAL RESOURCE_TRANSPORT_CEMENT 40 cement
$VEHICLE_STATION -7.00 0 -6.00  -7.00 0 14.00
$VEHICLE_STATION 0.00 0 -6.00  0.00 0 14.00
$VEHICLE_STATION 7.00 0 -6.00  7.00 0 14.00

; the siding: trains enter one side and leave the other
$CONNECTION_RAIL_ALLOWPASS
-32.0 0.0 -18.0
-30.0 0.0 -18.0
$CONNECTION_RAIL_ALLOWPASS
32.0 0.0 -18.0
30.0 0.0 -18.0
$CONNECTIONS_SPACE
0.0 0.0
-32.0 32.0
------------------
$CONNECTIONS_ROAD_DEAD_SQUARE
-32.0 27.0
32.0 -27.0

$CONNECTION_ROAD
0.0 0.0 29.0
0.0 0.0 28.0
$CONNECTION_ADVANCED_POINT  0.0 0.0 18.0
$CONNECTION_PEDESTRIAN
-8.5 0.0 28.0
-8.5 0.0 29.0

$PARTICLE factory_small_gray 26.0 9.6 -22.0 1 1
$PARTICLE factory_small_gray -7.0 2.0 -5.0 1 1
$PARTICLE factory_small_gray 7.0 2.0 -5.0 1 1

$TEXT_CAPTION
-6.0 6.0 25.2
6.0 6.0 25.2

end
