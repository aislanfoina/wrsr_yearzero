; Importing House - configuration
;
; This file is read by trade_post.dll from the folder the DLL itself is in
; (rml\plugins). It does NOT go through TsmHost::configInt, which resolves
; against a different folder under Republic Mod Loader and never finds anything.
;
; [general] and [price] take effect when the game starts.
; [production] is applied by build.ps1 -Install, because production rates live
; in each building's building.ini, which only the game's own parser reads.

[general]

; What the house charges, as a multiple of the resource's normal market price.
; Above 1.0 makes it a middleman; below 1.0 makes importing cheaper than making
; the goods yourself.
price_multiplier = 1.35

; RUB or USD. Which balance the purchase is deducted from.
currency = RUB

; Roubles per dollar. Only used when currency = USD. The game's price field is
; rouble-denominated, so the charge is divided by this to get dollars. At 1.0 a
; dollar purchase costs the same number as a rouble one, which is very
; expensive in real terms - set this to your preferred exchange rate.
usd_rate = 1.0

[price]

; Optional per-resource multipliers, overriding price_multiplier above.
; Anything not listed here uses the global value.
;
; eletronics = 2.00
; food       = 1.10

[production]

; Tonnes per day at full staffing, per resource. Applied at install time.
; A resource listed here replaces that building's $PRODUCTION line; the
; matching storage stays as the building defines it.

gravel     = 0.60
bricks     = 0.20
boards     = 0.15
steel      = 0.12
cement     = 0.10

food       = 0.40
alcohol    = 0.15
clothes    = 0.12
eletronics = 0.05
